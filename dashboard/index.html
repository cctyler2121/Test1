<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EU Contract Awards — Company Rollup</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --gridline: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --series-blue: #2a78d6;
    --series-blue-soft: #cde2fb;
    --card-shadow: 0 1px 2px rgba(11,11,11,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --gridline: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --series-blue: #3987e5;
      --series-blue-soft: #184f95;
      --card-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --gridline: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --series-blue: #3987e5;
    --series-blue-soft: #184f95;
    --card-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
  }
  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--text-secondary);
    font-size: 0.9rem;
    margin: 0 0 24px;
    line-height: 1.5;
  }
  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat-tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: var(--card-shadow);
  }
  .stat-tile .value {
    font-size: 1.4rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .stat-tile .label {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .search-box {
    width: 100%;
    font-size: 1.05rem;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-primary);
    margin-bottom: 8px;
  }
  .search-box:focus {
    outline: 2px solid var(--series-blue);
    outline-offset: 1px;
  }
  .search-hint {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin: 0 0 24px;
  }

  section h2 {
    font-size: 1.05rem;
    margin: 32px 0 12px;
  }

  .bar-row {
    display: grid;
    grid-template-columns: 220px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 5px 0;
  }
  .bar-name {
    font-size: 0.85rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bar-track {
    background: var(--gridline);
    border-radius: 4px;
    height: 14px;
    position: relative;
  }
  .bar-fill {
    background: var(--series-blue);
    height: 100%;
    border-radius: 4px;
    min-width: 4px;
  }
  .bar-value {
    font-size: 0.78rem;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .company-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 10px;
    box-shadow: var(--card-shadow);
    overflow: hidden;
  }
  .company-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 14px 16px;
    cursor: pointer;
  }
  .company-name {
    font-weight: 600;
    font-size: 0.98rem;
  }
  .company-meta {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .company-total {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-align: right;
  }
  .chevron {
    color: var(--text-muted);
    font-size: 0.8rem;
    transition: transform 0.15s ease;
  }
  .company-card.open .chevron { transform: rotate(90deg); }

  .company-detail {
    display: none;
    padding: 0 16px 16px;
    border-top: 1px solid var(--gridline);
  }
  .company-card.open .company-detail { display: block; }

  .variant-chip {
    display: inline-block;
    font-size: 0.75rem;
    background: var(--series-blue-soft);
    color: var(--text-primary);
    padding: 3px 9px;
    border-radius: 999px;
    margin: 8px 6px 0 0;
  }

  .flag-large {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    color: #92400e;
    background: #fef3c7;
    padding: 1px 6px;
    border-radius: 4px;
    margin-left: 6px;
    cursor: help;
    white-space: nowrap;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .flag-large {
      color: #fde68a;
      background: #4a3510;
    }
  }
  :root[data-theme="dark"] .flag-large {
    color: #fde68a;
    background: #4a3510;
  }

  table.contracts {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
    font-size: 0.8rem;
  }
  table.contracts th {
    text-align: left;
    color: var(--text-muted);
    font-weight: 500;
    border-bottom: 1px solid var(--gridline);
    padding: 6px 8px;
  }
  table.contracts td {
    border-bottom: 1px solid var(--gridline);
    padding: 6px 8px;
    vertical-align: top;
  }
  table.contracts td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.contracts a { color: var(--series-blue); text-decoration: none; }
  table.contracts a:hover { text-decoration: underline; }

  .empty-state, .load-state {
    color: var(--text-muted);
    font-size: 0.9rem;
    padding: 24px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>EU Contract Awards — Company Rollup</h1>
  <p class="subtitle" id="subtitle">Loading dataset…</p>

  <div class="stat-row" id="statRow"></div>

  <input
    class="search-box"
    id="searchInput"
    type="text"
    placeholder="Search by company name…"
    autocomplete="off"
  />
  <p class="search-hint">
    Matches are grouped across all legal-entity name variants of a company
    (e.g. different national subsidiaries or spelling variants) into one
    rolled-up total.
  </p>

  <section>
    <h2>Top 15 companies by awarded value</h2>
    <div id="topChart"></div>
  </section>

  <section>
    <h2 id="resultsHeading">All companies</h2>
    <div id="results"></div>
  </section>
</div>

<script>
const eurFmt = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const intFmt = new Intl.NumberFormat('en-GB');

function fmtEur(n) {
  if (n === null || n === undefined) return '—';
  return eurFmt.format(n);
}

// TED sometimes reports a framework agreement's overall ceiling value in
// the same field this pipeline treats as "awarded value" (confirmed by
// checking a real notice: TED's own "result value" field matched the
// framework total exactly, with no separate call-off amount exposed
// anywhere in the API). There's no reliable way to tell that case apart
// from a genuine single large award, so values above this threshold get
// flagged for manual verification rather than silently trusted.
const LARGE_VALUE_THRESHOLD_EUR = 250_000_000;
const LARGE_VALUE_TITLE =
  'Unusually large value — verify before relying on it. May be a framework ' +
  "agreement's overall ceiling rather than an actual award/spend amount, " +
  'or a data-entry anomaly in the source TED notice. Click through to the ' +
  'notice to check.';

function isLargeValue(eur) {
  return typeof eur === 'number' && eur >= LARGE_VALUE_THRESHOLD_EUR;
}

function largeValueBadge() {
  return `<span class="flag-large" title="${escapeHtml(LARGE_VALUE_TITLE)}">⚠ verify</span>`;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

let companies = [];

async function init() {
  let metadata = null;
  try {
    metadata = await fetch('../data/metadata.json').then(r => r.ok ? r.json() : null);
  } catch (e) { /* optional */ }

  try {
    companies = await fetch('../data/companies.json').then(r => r.json());
  } catch (e) {
    document.getElementById('results').innerHTML =
      '<p class="empty-state">Could not load data/companies.json. Run scripts/ted_fetch.py first, ' +
      'and serve this page over HTTP (not file://) so the browser can fetch local JSON.</p>';
    document.getElementById('subtitle').textContent = 'No data loaded.';
    return;
  }

  if (metadata) {
    const scope = [
      metadata.buyer_countries?.join(', '),
      metadata.cpv_prefixes ? `CPV ${metadata.cpv_prefixes.join('/')}*` : null,
      metadata.date_from ? `since ${metadata.date_from}` : null,
    ].filter(Boolean).join(' · ');
    document.getElementById('subtitle').textContent =
      `Scope: ${scope}. Generated ${new Date(metadata.generated_at).toLocaleString()}.`;
  } else {
    document.getElementById('subtitle').textContent =
      `${companies.length} companies loaded.`;
  }

  renderStats();
  renderTopChart();
  renderResults(companies);

  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      document.getElementById('resultsHeading').textContent = 'All companies';
      renderResults(companies);
      return;
    }
    const matches = companies.filter(c =>
      c.display_name.toLowerCase().includes(q) ||
      c.variants.some(v => v.toLowerCase().includes(q))
    );
    document.getElementById('resultsHeading').textContent =
      `${matches.length} match${matches.length === 1 ? '' : 'es'} for "${e.target.value.trim()}"`;
    renderResults(matches);
  });
}

function renderStats() {
  const totalCompanies = companies.length;
  const totalContracts = companies.reduce((s, c) => s + c.contract_count, 0);
  const totalValue = companies.reduce((s, c) => s + (c.total_value_eur || 0), 0);
  const tiles = [
    ['Companies', intFmt.format(totalCompanies)],
    ['Contracts', intFmt.format(totalContracts)],
    ['Total awarded', fmtEur(totalValue)],
  ];
  document.getElementById('statRow').innerHTML = tiles.map(([label, value]) => `
    <div class="stat-tile">
      <div class="value">${value}</div>
      <div class="label">${label}</div>
    </div>
  `).join('');
}

function renderTopChart() {
  const top = companies.slice(0, 15);
  const max = top.length ? top[0].total_value_eur : 1;
  document.getElementById('topChart').innerHTML = top.map(c => `
    <div class="bar-row">
      <div class="bar-name" title="${escapeHtml(c.display_name)}">${escapeHtml(c.display_name)}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${max ? (c.total_value_eur / max * 100) : 0}%"></div>
      </div>
      <div class="bar-value">${fmtEur(c.total_value_eur)}${c.records.some(r => isLargeValue(r.total_value_eur)) ? largeValueBadge() : ''}</div>
    </div>
  `).join('');
}

function renderResults(list) {
  const container = document.getElementById('results');
  if (!list.length) {
    container.innerHTML = '<p class="empty-state">No companies match that search.</p>';
    return;
  }
  container.innerHTML = list.slice(0, 200).map((c, i) => `
    <div class="company-card" id="card-${i}">
      <div class="company-head" onclick="toggleCard(${i})">
        <div>
          <div class="company-name">${escapeHtml(c.display_name)}</div>
          <div class="company-meta">
            ${c.contract_count} contract${c.contract_count === 1 ? '' : 's'}
            ${c.variants.length > 1 ? `· ${c.variants.length} legal-entity variants` : ''}
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="company-total">${fmtEur(c.total_value_eur)}${c.records.some(r => isLargeValue(r.total_value_eur)) ? largeValueBadge() : ''}</div>
          <div class="chevron">▶</div>
        </div>
      </div>
      <div class="company-detail">
        ${c.variants.length > 1 ? c.variants.map(v => `<span class="variant-chip">${escapeHtml(v)}</span>`).join('') : ''}
        <table class="contracts">
          <thead>
            <tr>
              <th>Buyer</th><th>Country</th><th>CPV</th><th>Date</th>
              <th>Value</th><th>Notice</th>
            </tr>
          </thead>
          <tbody>
            ${c.records.slice().sort((a, b) => (b.total_value_eur || 0) - (a.total_value_eur || 0)).map(r => `
              <tr>
                <td>${escapeHtml(r.buyer_name)}</td>
                <td>${escapeHtml(r.buyer_country)}</td>
                <td>${escapeHtml((r.cpv_codes || []).join(', '))}</td>
                <td class="num">${escapeHtml(r.publication_date)}</td>
                <td class="num">${fmtEur(r.total_value_eur)}${r.multi_winner_notice ? ' *' : ''}${isLargeValue(r.total_value_eur) ? largeValueBadge() : ''}</td>
                <td>${r.notice_url ? `<a href="${escapeHtml(r.notice_url)}" target="_blank" rel="noopener">${escapeHtml(r.publication_number)}</a>` : escapeHtml(r.publication_number)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        ${c.records.some(r => r.multi_winner_notice) ? '<p class="company-meta">* Notice had multiple winners; value shown is the notice total split evenly across winners (an approximation — see README).</p>' : ''}
        ${c.records.some(r => isLargeValue(r.total_value_eur)) ? `<p class="company-meta">⚠ verify — one or more values above ${fmtEur(LARGE_VALUE_THRESHOLD_EUR)} may be a framework agreement's overall ceiling rather than an actual award amount (see README).</p>` : ''}
      </div>
    </div>
  `).join('');
}

function toggleCard(i) {
  document.getElementById(`card-${i}`).classList.toggle('open');
}

init();
</script>
</body>
</html>

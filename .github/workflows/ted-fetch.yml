name: Fetch TED contract award data

on:
  workflow_dispatch: {}
  schedule:
    # Daily at 03:17 UTC. Scheduled runs only fire on the repository's
    # default branch (a GitHub restriction) — see README.md.
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch TED contract award notices
        run: python3 scripts/ted_fetch.py
      - name: Upload raw flat records as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: contract-awards-raw
          path: data/contract_awards.json
          retention-days: 30
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch --quiet data/contract_awards.json data/companies.json
          git add data/companies.json.gz data/metadata.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "Refresh TED contract award data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push

name: TED API CPV taxonomy discovery (manual)

on:
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe candidate CPV codes for the market-trends taxonomy
        run: python3 scripts/discover_cpv_taxonomy.py
